<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Game Đua Xe - Tung</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #0b1021;
    color: #fff;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #wrap {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    background: linear-gradient(#1a1a2e, #0f0f1a);
    border: 4px solid #e100ff;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(225, 0, 255, 0.35);
    max-width: 100%; max-height: 100%;
  }
  #ui {
    position: absolute; top: 14px; left: 0; right: 0;
    display: flex; justify-content: space-between; padding: 0 24px;
    font-size: 18px; font-weight: 700; letter-spacing: 2px;
    color: #00f2ff; text-shadow: 0 0 10px #00f2ff;
    z-index: 10; pointer-events: none;
  }
  #overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; text-align: center;
  }
  h1 { margin: 0 0 10px; font-size: 36px; color: #00f2ff; text-shadow: 0 0 14px #00f2ff; letter-spacing: 4px; }
  p { margin: 0 0 18px; font-size: 16px; color: #ddd; }
  button {
    padding: 12px 30px; font-size: 18px; font-weight: 800; color: #000;
    background: #00f2ff; border: none; border-radius: 8px; cursor: pointer;
    box-shadow: 0 0 20px #00f2ff; letter-spacing: 2px;
  }
  button:active { transform: scale(0.95); }
  .controls { position: absolute; bottom: 22px; left: 0; right: 0; display: flex; justify-content: center; gap: 40px; z-index: 15; pointer-events: auto; }
  .pad { width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.35); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: #00f2ff; user-select: none; -webkit-tap-highlight-color: transparent; }
  .pad:active { background: rgba(0,242,255,0.25); }
  .note { position: absolute; top: 70px; left: 0; right: 0; text-align: center; font-size: 13px; color: #888; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="ui"><span id="score">SCORE 0</span><span id="best">BEST 0</span></div>
  <canvas id="c"></canvas>
  <div id="overlay">
    <h1 id="oTitle">ĐUA XE</h1>
    <p id="oMsg">Tránh các xe đối thủ, đi càng xa điểm càng cao!</p>
    <button id="startBtn">BẮT ĐẦU</button>
  </div>
  <div class="controls">
    <div class="pad" id="btnLeft">◀</div>
    <div class="pad" id="btnRight">▶</div>
  </div>
  <div class="note">Phím mũi tên ← → hoặc A D để lái · Chạm bên trái/phải màn hình</div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const oTitle = document.getElementById('oTitle');
const oMsg = document.getElementById('oMsg');
const startBtn = document.getElementById('startBtn');
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');

let width, height, cx;
function resize() {
  width = canvas.clientWidth;
  height = canvas.clientHeight;
  cx = width / 2;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Game state ---
let state = 'MENU'; // MENU, PLAY, OVER
let score = 0;
let best = localStorage.getItem('racing_best') || 0;
bestEl.textContent = 'BEST ' + best;

const laneCount = 3;
const lanes = []; // center x of each lane
function calcLanes() {
  const pad = 60;
  const usable = width - pad * 2;
  const step = usable / laneCount;
  for (let i = 0; i < laneCount; i++) lanes[i] = pad + step * (i + 0.5);
}
calcLanes();

// Car template
function makeCar(x, y, w, h, color, speed, player) {
  return { x, y, w, h, color, speed, player, ax: x };
}
let player, cars, roadY, baseSpeed, speed, spawnTimer, spawnInterval, accel;

function reset() {
  lanes.length = 0; calcLanes();
  const pw = 46, ph = 78;
  player = makeCar(cx, height - ph - 40, pw, ph, '#00f2ff', 0, true);
  cars = [player];
  roadY = 0;
  baseSpeed = 4.2;
  speed = baseSpeed;
  spawnTimer = 0;
  spawnInterval = 700;
  accel = 0.00012;
  score = 0;
  scoreEl.textContent = 'SCORE 0';
}

function spawnEnemy() {
  const ew = 46 + Math.random() * 20;
  const eh = 60 + Math.random() * 30;
  const li = Math.floor(Math.random() * laneCount);
  const x = lanes[li] - ew / 2;
  const ey = -eh - 20;
  const espeed = speed * (0.75 + Math.random() * 0.6);
  const car = makeCar(x, ey, ew, eh, '#ff3366', espeed, false);
  // slight wiggle
  car.wiggle = Math.random() * Math.PI * 2;
  cars.push(car);
}

function rectIntersect(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

// --- Input ---
const keys = {};
window.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'a' || e.key === 'd' || e.key === 'A' || e.key === 'D') keys[e.key] = true; });
window.addEventListener('keyup', e => { keys[e.key] = false; });

function onLeft() { keys.__L = true; setTimeout(() => { keys.__L = false; }, 150); }
function onRight() { keys.__R = true; setTimeout(() => { keys.__R = false; }, 150); }
btnLeft.addEventListener('touchstart', e => { e.preventDefault(); onLeft(); }, {passive: false});
btnLeft.addEventListener('mousedown', onLeft);
btnRight.addEventListener('touchstart', e => { e.preventDefault(); onRight(); }, {passive: false});
btnRight.addEventListener('mousedown', onRight);
startBtn.addEventListener('click', () => { state = 'PLAY'; overlay.style.display = 'none'; });
document.addEventListener('keydown', e => { if (state === 'PLAY' && (e.key === 'Enter' || e.key === ' ')) {} });
window.addEventListener('keydown', e => { if ((state === 'MENU' || state === 'OVER') && (e.key === 'Enter' || e.key === ' ')) { state = 'PLAY'; overlay.style.display = 'none'; } });
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0].clientX;
  if (state === 'PLAY') {
    if (t < cx) keys.__L = true; else keys.__R = true;
    setTimeout(() => { keys.__L = false; keys.__R = false; }, 150);
  } else { state = 'PLAY'; overlay.style.display = 'none'; }
}, {passive: false});

// --- Draw car ---
function drawCar(car) {
  ctx.save();
  ctx.translate(car.x + car.w / 2, car.y + car.h / 2);
  ctx.fillStyle = car.color;
  ctx.shadowColor = car.color;
  ctx.shadowBlur = 14;
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#fff';
  ctx.beginPath();
  ctx.roundRect(-car.w/2, -car.h/2, car.w, car.h, 10);
  ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  // cabin
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillRect(-car.w/2 + 6, -car.h/2 + 8, car.w - 12, car.h/2 - 14);
  // wheels
  ctx.fillStyle = '#111';
  ctx.fillRect(-car.w/2 + 8, -car.h/2 + car.h/3 - 2, 10, 16);
  ctx.fillRect(car.w/2 - 18, -car.h/2 + car.h/3 - 2, 10, 16);
  ctx.restore();
}

function drawRoad() {
  ctx.fillStyle = '#141423';
  ctx.fillRect(0, 0, width, height);
  // road
  const roadW = width * 0.72;
  const rx = (width - roadW) / 2;
  ctx.fillStyle = '#262638';
  ctx.fillRect(rx, 0, roadW, height);
  // borders
  ctx.strokeStyle = '#e100ff';
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(rx, 0); ctx.lineTo(rx, height); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(rx + roadW, 0); ctx.lineTo(rx + roadW, height); ctx.stroke();
  // dashed lines
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 5;
  ctx.setLineDash([30, 40]);
  roadY = (roadY + speed * 2) % 70;
  const step = height / 5;
  for (let i = -1; i <= 5; i++) {
    const y = i * step + roadY;
    ctx.beginPath(); ctx.moveTo(cx, y); ctx.lineTo(cx, y + 30); ctx.stroke();
  }
  ctx.setLineDash([]);
}

function update() {
  if (state !== 'PLAY') return;

  score += speed * 0.06;
  speed += accel;
  if (score / 1000 > (spawnInterval / 700) * 0 + 0) {}
  spawnTimer += 16;
  if (spawnTimer > spawnInterval) {
    spawnEnemy();
    spawnTimer = 0;
    spawnInterval = Math.max(400, 700 - score * 0.02);
  }

  // move player lane
  const targetLane = player.ax;
  const stepLane = lanes[1] - lanes[0];
  if (keys.__L && player.ax > lanes[0]) player.ax -= stepLane * 0.22;
  if (keys.__R && player.ax < lanes[laneCount - 1]) player.ax += stepLane * 0.22;
  player.x += (player.ax - player.w / 2 - player.x) * 0.18;

  // move enemies
  for (let i = cars.length - 1; i >= 1; i--) {
    const car = cars[i];
    car.y += car.speed;
    if (car.wiggle) car.x += Math.sin(Date.now() * 0.003 + car.wiggle) * 0.9;
    if (rectIntersect(player, car)) {
      state = 'OVER';
      if (score > best) { best = score; localStorage.setItem('racing_best', best); bestEl.textContent = 'BEST ' + Math.floor(best); }
      showOver();
      return;
    }
    if (car.y > height) {
      cars.splice(i, 1);
    }
  }
}

function draw() {
  drawRoad();
  for (const car of cars) drawCar(car);
  scoreEl.textContent = 'SCORE ' + Math.floor(score);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function showOver() {
  overlay.style.display = 'flex';
  oTitle.textContent = 'HẾT TRÒ';
  oMsg.textContent = 'Bạn đi được ' + Math.floor(score) + ' mét.\nBản ghi cao: ' + Math.floor(best) + ' mét.';
  startBtn.textContent = 'CHƠI LẠI';
}

reset();
loop();
</script>
</body>
</html>
